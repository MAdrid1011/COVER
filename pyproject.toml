[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cover-simulator"
version = "0.2.0"
description = "Auditable COVER architecture simulator"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "numpy>=1.24", "scipy>=1.10"]

[project.scripts]
cover-sim = "cover_sim.cli:main"

[project.optional-dependencies]
quality = ["scikit-image>=0.21", "lpips>=0.1.4"]
parquet = ["pyarrow>=12"]
assets = ["requests>=2.31", "gdown>=5.2", "tifffile>=2023.7", "olefile>=0.47"]

[project.urls]
Repository = "https://github.com/MAdrid1011/COVER"
Documentation = "https://github.com/MAdrid1011/COVER/tree/main/docs"

[tool.setuptools.packages.find]
include = ["cover_sim", "cover_sim.*"]
exclude = ["configs*", "docs*", "native*", "tests*", "tools*"]

[tool.setuptools.package-data]
cover_sim = ["**/*.md", "**/*.cpp", "**/*.cu"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
